// deterministic random
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  woodDark: '#3a271d', black: '#121212',
};
const mats = {};
function M(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!mats[key]) mats[key] = new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, metalness: 0, ...opts });
  return mats[key];
}
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
// jitter vertices for the hand-made low-poly look (keeps shared verts together)
function facet(geo, amt, seed = 1) {
  geo = geo.index ? geo.toNonIndexed() : geo;
  const r = rng(seed), p = geo.attributes.position, map = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = `${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
    if (!map.has(k)) map.set(k, [(r() - .5) * amt, (r() - .5) * amt, (r() - .5) * amt]);
    const d = map.get(k);
    p.setXYZ(i, p.getX(i) + d[0], p.getY(i) + d[1], p.getZ(i) + d[2]);
  }
  geo.computeVertexNormals();
  return geo;
}
const blob = (r, detail = 1, j = 0.12, seed = 1) => facet(new THREE.IcosahedronGeometry(r, detail), r * j, seed);

{

    leaf.rotation.set(Math.sin(a) * 0.6, 0, -Math.cos(a) * 0.6);

// board drawing helpers — p = 0..1 reveal progress
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const prog = (t, a, d) => clamp((t - a) / d);
function writeText(txt, x, y, size, color, p, weight = 700, align = 'left') {
  if (p <= 0) return;
  bx.save(); bx.font = `${weight} ${size}px Inter`; bx.fillStyle = color; bx.textAlign = align; bx.textBaseline = 'middle';
  const w = bx.measureText(txt).width, x0 = align === 'center' ? x - w / 2 : x;
  bx.beginPath(); bx.rect(x0 - 4, y - size, (w + 8) * p, size * 2); bx.clip();
  bx.fillText(txt, x, y); bx.restore();
}
function strokePath(pts, color, width, p) { // polyline revealed by length
  if (p <= 0) return;
  let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  let left = total * p;
  bx.save(); bx.strokeStyle = color; bx.lineWidth = width; bx.lineCap = 'round'; bx.lineJoin = 'round';
  bx.beginPath(); bx.moveTo(...pts[0]);
  let end = pts[0];
  for (let i = 1; i < pts.length && left > 0; i++) {
    const [ax, ay] = pts[i - 1], [cx, cy] = pts[i], seg = Math.hypot(cx - ax, cy - ay), f = Math.min(1, left / seg);
    end = [ax + (cx - ax) * f, ay + (cy - ay) * f]; bx.lineTo(...end); left -= seg;
  }
  bx.stroke(); bx.restore();
  return end;
}
function arrow(x1, y1, x2, y2, color, p, width = 7) {
  if (p <= 0) return;
  const e = strokePath([[x1, y1], [x2, y2]], color, width, p);
  if (p > 0.95) { const a = Math.atan2(y2 - y1, x2 - x1);
    strokePath([[x2 - 26 * Math.cos(a - 0.5), y2 - 26 * Math.sin(a - 0.5)], [x2, y2], [x2 - 26 * Math.cos(a + 0.5), y2 - 26 * Math.sin(a + 0.5)]], color, width, 1); }
}
function rectPath(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]]; }
const INK = '#1d2433', BLUE = '#2f6fd6', RED = '#d6453d', GREEN = '#2e9b57';

function drawBoard(t) {
  bx.fillStyle = '#f7f8fb'; bx.fillRect(0, 0, bc.width, bc.height);
  // faint ghosting of old marker
  bx.globalAlpha = 0.05; bx.fillStyle = '#556'; bx.fillRect(900, 620, 300, 40); bx.fillRect(120, 650, 220, 30); bx.globalAlpha = 1;
  writeText('What is an API?', 648, 92, 74, INK, 1, 800, 'center');
  strokePath([[340, 150], [956, 150]], INK, 6, 1);

  // 1. you (laptop) — "You ask"
  const pA = prog(t, 8.2, 1.4);
  strokePath(rectPath(110, 300, 190, 125), INK, 7, pA);
  strokePath([[80, 445], [330, 445], [310, 425], [100, 425], [80, 445]], INK, 7, prog(t, 8.9, 0.6));
  writeText('You', 205, 515, 54, INK, prog(t, 9.4, 0.6), 700, 'center');
  writeText('(the customer)', 205, 570, 34, '#6a7285', prog(t, 9.9, 0.7), 600, 'center');

  // 2. kitchen / server
  const pB = prog(t, 12.2, 1.4);
  strokePath(rectPath(985, 285, 210, 175), INK, 7, pB);
  for (let i = 0; i < 3; i++) strokePath([[1005, 330 + i * 45], [1175, 330 + i * 45]], INK, 5, prog(t, 12.9 + i * 0.2, 0.5));
  writeText('Kitchen', 1090, 515, 54, INK, prog(t, 13.4, 0.6), 700, 'center');
  writeText('(the server)', 1090, 570, 34, '#6a7285', prog(t, 13.9, 0.7), 600, 'center');
  writeText('STAFF ONLY', 1090, 255, 30, RED, prog(t, 14.3, 0.6), 800, 'center');

  // 3. API waiter in the middle + order arrow
  strokePath(rectPath(540, 300, 215, 120), BLUE, 8, prog(t, 15.9, 1.0));
  writeText('API', 648, 362, 70, BLUE, prog(t, 16.6, 0.5), 800, 'center');
  writeText('(the waiter)', 648, 470, 34, BLUE, prog(t, 17.0, 0.6), 600, 'center');
  arrow(320, 335, 520, 335, INK, prog(t, 17.4, 0.7));
  arrow(775, 335, 965, 335, INK, prog(t, 18.2, 0.7));
  writeText('order', 420, 300, 32, INK, prog(t, 17.6, 0.5), 600, 'center');

  // 4. answer comes back
  arrow(965, 400, 775, 400, GREEN, prog(t, 19.9, 0.7));
  arrow(520, 400, 320, 400, GREEN, prog(t, 20.7, 0.7));
  writeText('your answer', 420, 440, 32, GREEN, prog(t, 21.3, 0.6), 700, 'center');

  // 5. extra notes
  writeText('menu = the docs', 110, 655, 44, GREEN, prog(t, 26.6, 1.0), 700, 'left');
  writeText('error 500 = kitchen on fire', 110, 730, 40, RED, prog(t, 32.2, 1.2), 700, 'left');
  if (t > 33.4) { // little flame
    const f = Math.min(1, (t - 33.4) * 3), fl = Math.sin(t * 20) * 4;
    bx.save(); bx.globalAlpha = f; bx.fillStyle = '#ff7a2f';
    bx.beginPath(); bx.moveTo(1090, 288); bx.quadraticCurveTo(1045, 240 + fl, 1070, 190); bx.quadraticCurveTo(1085, 230, 1100, 210 - fl); bx.quadraticCurveTo(1135, 245, 1090, 288); bx.fill();
    bx.fillStyle = '#ffd23f'; bx.beginPath(); bx.moveTo(1090, 288); bx.quadraticCurveTo(1068, 255, 1086, 228 + fl); bx.quadraticCurveTo(1112, 258, 1090, 288); bx.fill(); bx.restore();
  }
  boardTex.needsUpdate = true;
}

{
